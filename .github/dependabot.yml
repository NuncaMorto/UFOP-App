version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "NuncaMorto"
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/android-app"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "NuncaMorto"
    groups:
      android-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "NuncaMorto"
