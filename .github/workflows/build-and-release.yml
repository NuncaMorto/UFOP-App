name: Build and Release (Android & iOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Plataforma para compilar"
        required: true
        default: "ios"
        type: choice
        options:
          - ios
          - android
          - both
      release_tag:
        description: "Tag da Release (ex.: v1.9.6) para anexar os binários compilados (opcional)"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Marcar Release no GitHub como Pre-release (beta/testes)"
        required: false
        default: true
        type: boolean
      android_build_type:
        description: "Build Android (release assinado requer secrets ANDROID_KEYSTORE_*)"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  ios-ipa:
    name: Build iOS (.ipa unsigned)
    runs-on: macos-15
    timeout-minutes: 25
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26 SDK (Liquid Glass)
        run: |
          for candidate in \
            "/Applications/Xcode_26.3.app/Contents/Developer" \
            "/Applications/Xcode_26.2.app/Contents/Developer" \
            "/Applications/Xcode_26.1.1.app/Contents/Developer" \
            "/Applications/Xcode_26.app/Contents/Developer"
          do
            if [[ -d "${candidate}" ]]; then
              sudo xcode-select -s "${candidate}"
              break
            fi
          done
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Ensure XcodeGen is installed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Resolve version metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
            [[ "${TAG}" == v* ]] || TAG="v${TAG}"
          else
            RAW_VER="$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' android-app/app/build.gradle.kts | head -n 1)"
            TAG="v${RAW_VER:-1.9.6}"
          fi
          VERSION="${TAG#v}"

          INPUT_PRE="${{ github.event.inputs.prerelease }}"
          if [[ "${TAG}" == *-* ]]; then
            IS_PRERELEASE="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${INPUT_PRE}" == "true" ]] || { [[ -z "${INPUT_PRE}" ]] && [[ "${GITHUB_REF_NAME}" == "develop" ]]; }; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          elif [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          echo "release_tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "is_prerelease=${IS_PRERELEASE}" >> "${GITHUB_OUTPUT}"

      - name: Build iOS .ipa (unsigned)
        env:
          VERSION_OVERRIDE: ${{ steps.meta.outputs.version }}
        run: |
          chmod +x scripts/build-ios-ipa.sh
          ./scripts/build-ios-ipa.sh

      - name: Upload iOS .ipa workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vida-academica-ufop-ios-ipa
          path: dist/*.ipa*

      - name: Attach .ipa to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.release_tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
        run: |
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            NOTES_FILE="$(mktemp)"
            python3 - "${VERSION}" "${NOTES_FILE}" << 'PY'
          import re, sys
          from pathlib import Path
          version, out_path = sys.argv[1], sys.argv[2]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          pat = re.compile(rf"^##\s+(?:\[)?v?{re.escape(version)}(?:\b|\]|\s|$)")
          cap, active = [], False
          for line in lines:
              if not active:
                  if pat.match(line):
                      active = True
                      cap.append(line)
              else:
                  if line.startswith("## "):
                      break
                  cap.append(line)
          while cap and cap[-1].strip() in ("", "---"):
              cap.pop()
          text = "\n".join(cap) + "\n" if cap else f"## Vida Acadêmica UFOP v{version}\n"
          Path(out_path).write_text(text, encoding="utf-8")
          PY
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              gh release create "${TAG}" --title "Vida Acadêmica UFOP ${TAG} (Beta / Testes)" --notes-file "${NOTES_FILE}" --prerelease
            else
              gh release create "${TAG}" --title "Vida Acadêmica UFOP ${TAG}" --notes-file "${NOTES_FILE}" --latest
            fi
          else
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              gh release edit "${TAG}" --prerelease
            else
              gh release edit "${TAG}" --prerelease=false --latest
            fi
          fi
          gh release upload "${TAG}" dist/*.ipa dist/*.ipa.sha256 --clobber

  android-apk:
    name: Verify Rust + Test & Build Android (.apk)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify Rust core
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Resolve version & build metadata
        id: meta
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
            [[ "${TAG}" == v* ]] || TAG="v${TAG}"
          else
            RAW_VER="$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' android-app/app/build.gradle.kts | head -n 1)"
            TAG="v${RAW_VER:-1.9.6}"
          fi
          VERSION="${TAG#v}"

          INPUT_PRE="${{ github.event.inputs.prerelease }}"
          if [[ "${TAG}" == *-* ]]; then
            IS_PRERELEASE="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${INPUT_PRE}" == "true" ]] || { [[ -z "${INPUT_PRE}" ]] && [[ "${GITHUB_REF_NAME}" == "develop" ]]; }; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          elif [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          WANT_RELEASE="false"
          if [[ "${{ github.event.inputs.android_build_type }}" == "release" ]] || { [[ "${GITHUB_REF}" == refs/tags/v* ]] && [[ "${IS_PRERELEASE}" == "false" ]]; }; then
            WANT_RELEASE="true"
          fi

          if [[ "${WANT_RELEASE}" == "true" && -n "${KEYSTORE_B64}" ]]; then
            BUILD_TYPE="release"
          else
            if [[ "${WANT_RELEASE}" == "true" && -z "${KEYSTORE_B64}" ]]; then
              echo "::warning::Build release solicitado, mas o secret ANDROID_KEYSTORE_BASE64 não está configurado; gerando debug APK."
            fi
            BUILD_TYPE="debug"
          fi

          echo "release_tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "is_prerelease=${IS_PRERELEASE}" >> "${GITHUB_OUTPUT}"
          echo "build_type=${BUILD_TYPE}" >> "${GITHUB_OUTPUT}"

      - name: Run Android unit tests & assemble APK
        env:
          FEEDBACK_RECIPIENT: ${{ secrets.FEEDBACK_RECIPIENT }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_TYPE: ${{ steps.meta.outputs.build_type }}
        run: |
          chmod +x android-app/gradlew
          cd android-app
          if [[ "${BUILD_TYPE}" == "release" ]]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/ufop-release.jks"
            export ANDROID_KEYSTORE_PATH="${RUNNER_TEMP}/ufop-release.jks"
            ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon
          else
            ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
          fi

      - name: Cleanup temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/ufop-release.jks"

      - name: Package APK & SHA-256
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_TYPE: ${{ steps.meta.outputs.build_type }}
        run: |
          mkdir -p dist
          if [[ "${BUILD_TYPE}" == "release" ]]; then
            APK_NAME="Vida-Academica-UFOP-v${VERSION}.apk"
            cp android-app/app/build/outputs/apk/release/app-release.apk "dist/${APK_NAME}"
          else
            APK_NAME="Vida-Academica-UFOP-v${VERSION}-debug.apk"
            cp android-app/app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"
          fi
          (cd dist && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")

      - name: Upload Android .apk workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vida-academica-ufop-android-apk
          path: dist/*.apk*

      - name: Attach .apk to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.release_tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
        run: |
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            NOTES_FILE="$(mktemp)"
            python3 - "${VERSION}" "${NOTES_FILE}" << 'PY'
          import re, sys
          from pathlib import Path
          version, out_path = sys.argv[1], sys.argv[2]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          pat = re.compile(rf"^##\s+(?:\[)?v?{re.escape(version)}(?:\b|\]|\s|$)")
          cap, active = [], False
          for line in lines:
              if not active:
                  if pat.match(line):
                      active = True
                      cap.append(line)
              else:
                  if line.startswith("## "):
                      break
                  cap.append(line)
          while cap and cap[-1].strip() in ("", "---"):
              cap.pop()
          text = "\n".join(cap) + "\n" if cap else f"## Vida Acadêmica UFOP v{version}\n"
          Path(out_path).write_text(text, encoding="utf-8")
          PY
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              gh release create "${TAG}" --title "Vida Acadêmica UFOP ${TAG} (Beta / Testes)" --notes-file "${NOTES_FILE}" --prerelease
            else
              gh release create "${TAG}" --title "Vida Acadêmica UFOP ${TAG}" --notes-file "${NOTES_FILE}" --latest
            fi
          else
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              gh release edit "${TAG}" --prerelease
            else
              gh release edit "${TAG}" --prerelease=false --latest
            fi
          fi
          gh release upload "${TAG}" dist/*.apk dist/*.apk.sha256 --clobber
