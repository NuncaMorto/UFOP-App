name: VidaAcademica
options:
  bundleIdPrefix: io.github.nuncamorto
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

targets:
  VidaAcademica:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CampusUFOP
        excludes:
          - "CoreFFI/Generated/**"
          - "Resources/Info.plist"
          - "Resources/Assets.xcassets/**"
          - "Resources/Data/**"
      - path: CampusUFOP/Resources/Assets.xcassets
        buildPhase: resources
      - path: CampusUFOP/Resources/Data
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: VidaAcademica
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nuncamorto.vidaacademica
        MARKETING_VERSION: "1.9.10"
        CURRENT_PROJECT_VERSION: "27"
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: minimal
        INFOPLIST_FILE: CampusUFOP/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        GENERATE_INFOPLIST_FILE: NO

schemes:
  VidaAcademica:
    build:
      targets:
        VidaAcademica: all
    run:
      config: Debug
    archive:
      config: Release
