name: VidaAcademica
options:
  bundleIdPrefix: io.github.nuncamorto
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

targets:
  VidaAcademica:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CampusUFOP
        excludes:
          - "CoreFFI/Generated/**"
          - "Widget/**"
          - "Resources/Info.plist"
          - "Resources/Assets.xcassets/**"
          - "Resources/Data/**"
          - "Resources/Fonts/**"
          - "Resources/VidaAcademica.entitlements"
      - path: CampusUFOP/Resources/Assets.xcassets
        buildPhase: resources
      - path: CampusUFOP/Resources/Fonts
        buildPhase: resources
      - path: CampusUFOP/Resources/Data
        optional: true
        buildPhase: resources
    dependencies:
      - target: VidaAcademicaWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_NAME: VidaAcademica
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nuncamorto.vidaacademica
        MARKETING_VERSION: "1.9.22"
        CURRENT_PROJECT_VERSION: "39"
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: minimal
        INFOPLIST_FILE: CampusUFOP/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: CampusUFOP/Resources/VidaAcademica.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        GENERATE_INFOPLIST_FILE: NO

  VidaAcademicaWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CampusUFOP/Widget/VidaAcademicaLiquidGlassWidget.swift
      - path: CampusUFOP/WidgetShared
      - path: CampusUFOP/Theme/CampusTheme.swift
      - path: CampusUFOP/CoreFFI/CampusCoreDomainModels.swift
      - path: CampusUFOP/Resources/Fonts
        buildPhase: resources
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        PRODUCT_NAME: VidaAcademicaWidgetExtension
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nuncamorto.vidaacademica.widget
        MARKETING_VERSION: "1.9.22"
        CURRENT_PROJECT_VERSION: "39"
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: minimal
        INFOPLIST_FILE: CampusUFOP/Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: CampusUFOP/Widget/VidaAcademicaWidgetExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

schemes:
  VidaAcademica:
    build:
      targets:
        VidaAcademica: all
    run:
      config: Debug
    archive:
      config: Release
